version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: smartcity_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartcity_db
      POSTGRES_USER: smartcity
      POSTGRES_PASSWORD: smartcity123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcity -d smartcity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcity_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://smartcity:smartcity123@db:5432/smartcity_db
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/ml_models:/app/ml_models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -c 'from app.utils.seed_data import seed_initial_data; from app.core.database import SessionLocal; db = SessionLocal(); seed_initial_data(db); db.close()' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # React Frontend (development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcity_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  postgres_data:

